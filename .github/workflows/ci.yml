name: CI

on:
  push:
  pull_request:

jobs:
  linux:
    name: Linux x86-64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build (warnings are errors) and run tests
        run: make CXXFLAGS="-std=c++17 -O2 -Wall -Wextra -Werror" test
      - name: Report version and targets
        run: |
          ./bfc --version
          ./bfc --targets

  sanitizers:
    name: Linux sanitizers (ASan + UBSan)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
      LSAN_OPTIONS: detect_leaks=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v4
      # test-san builds bfc-san with SANFLAGS (one g++ call does compile + link,
      # so the sanitizer runtime is linked) and runs the suite with BFC=bfc-san.
      - name: Build bfc-san with ASan + UBSan and run the suite against it
        run: make SANFLAGS="-std=c++17 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all -D_GLIBCXX_ASSERTIONS" test-san
      # Guard against a future change that drops -fsanitize from the link stage.
      - name: Assert the sanitizer runtime is linked
        run: |
          ldd bfc-san | grep -q libasan || { echo "error: libasan not linked"; exit 1; }
          ldd bfc-san | grep -q libubsan || { echo "error: libubsan not linked"; exit 1; }
      - name: Report version and targets
        run: |
          ./bfc-san --version
          ./bfc-san --targets

  linux-arm:
    name: Linux ARM64
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Build (warnings are errors) and run tests
        run: make CXXFLAGS="-std=c++17 -O2 -Wall -Wextra -Werror" test
      - name: Report version and targets
        run: |
          ./bfc --version
          ./bfc --targets

  macos-arm:
    name: macOS ARM64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        run: make CXXFLAGS="-std=c++17 -O2 -Wall -Wextra -Werror" test
      - name: Report version and targets
        run: |
          ./bfc --version
          ./bfc --targets

  macos:
    name: macOS x86-64
    # macos-13 is retired; cross-compile x86-64 on the arm64 runner and run the
    # tests under Rosetta when it is available.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Try to enable Rosetta
        id: rosetta
        run: |
          if arch -x86_64 true 2>/dev/null; then
            echo "ok=1" >> "$GITHUB_OUTPUT"
          elif sudo softwareupdate --install-rosetta --agree-to-license >/dev/null 2>&1 && arch -x86_64 true 2>/dev/null; then
            echo "ok=1" >> "$GITHUB_OUTPUT"
          else
            echo "ok=0" >> "$GITHUB_OUTPUT"
          fi
      - name: Build (warnings are errors) for x86-64
        run: make CXX="clang++" CXXFLAGS="-std=c++17 -O2 -Wall -Wextra -Werror -arch x86_64" LDFLAGS=""
      - name: Run tests under Rosetta
        if: steps.rosetta.outputs.ok == '1'
        run: arch -x86_64 sh tests/run_tests.sh
      - name: Warn when Rosetta is unavailable
        if: steps.rosetta.outputs.ok != '1'
        run: echo "::warning::Rosetta unavailable; macOS x86-64 was built but not run-tested"
      - name: Report version and targets
        run: |
          file ./bfc
          ./bfc --version || true
          ./bfc --targets || true

  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build (warnings are errors)
        shell: pwsh
        run: g++ -std=c++17 -O2 -Wall -Wextra -Werror -static -o bfc.exe bfc.cpp
      - name: Run tests
        shell: pwsh
        run: ./tests/run_tests.ps1
      - name: Report version and targets
        shell: pwsh
        run: |
          ./bfc.exe --version
          ./bfc.exe --targets
