name: CI

on:
  push:
  pull_request:

jobs:
  linux:
    name: Linux x86-64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build (warnings are errors) and run tests
        run: make CXXFLAGS="-std=c++17 -O2 -Wall -Wextra -Werror" test
      - name: Report version and targets
        run: |
          ./bfc --version
          ./bfc --targets

  linux-arm:
    name: Linux ARM64
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Build (warnings are errors) and run tests
        run: make CXXFLAGS="-std=c++17 -O2 -Wall -Wextra -Werror" test
      - name: Report version and targets
        run: |
          ./bfc --version
          ./bfc --targets

  macos-arm:
    name: macOS ARM64 (experimental)
    # aarch64-macos is implemented but not yet verified on real hardware.
    # Promote to a required job once this is green.
    continue-on-error: true
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        run: make CXXFLAGS="-std=c++17 -O2 -Wall -Wextra -Werror" test
      - name: Report version and targets
        run: |
          ./bfc --version
          ./bfc --targets

  macos:
    name: macOS x86-64
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
      - name: Build (warnings are errors) and run tests
        run: make CXXFLAGS="-std=c++17 -O2 -Wall -Wextra -Werror" test
      - name: Report version and targets
        run: |
          ./bfc --version
          ./bfc --targets

  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build (warnings are errors)
        shell: pwsh
        run: g++ -std=c++17 -O2 -Wall -Wextra -Werror -static -o bfc.exe bfc.cpp
      - name: Run tests
        shell: pwsh
        run: ./tests/run_tests.ps1
      - name: Report version and targets
        shell: pwsh
        run: |
          ./bfc.exe --version
          ./bfc.exe --targets
