name: CI

on:
  push:
  pull_request:

jobs:
  linux:
    name: Linux x86-64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build (warnings are errors) and run tests
        run: make CXXFLAGS="-std=c++17 -O2 -Wall -Wextra -Werror" test
      - name: Report version and targets
        run: |
          ./bfc --version
          ./bfc --targets

  sanitizers:
    name: Linux sanitizers (ASan + UBSan)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
      LSAN_OPTIONS: detect_leaks=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v4
      # test-san builds bfc-san with SANFLAGS (one g++ call does compile + link,
      # so the sanitizer runtime is linked) and runs the suite with BFC=bfc-san.
      - name: Build bfc-san with ASan + UBSan and run the suite against it
        run: make SANFLAGS="-std=c++17 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all -D_GLIBCXX_ASSERTIONS" test-san
      # Guard against a future change that drops -fsanitize from the link stage.
      - name: Assert the sanitizer runtime is linked
        run: |
          ldd bfc-san | grep -q libasan || { echo "error: libasan not linked"; exit 1; }
          ldd bfc-san | grep -q libubsan || { echo "error: libubsan not linked"; exit 1; }
      - name: Report version and targets
        run: |
          ./bfc-san --version
          ./bfc-san --targets

  linux-arm:
    name: Linux ARM64
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Build (warnings are errors) and run tests
        run: make CXXFLAGS="-std=c++17 -O2 -Wall -Wextra -Werror" test
      - name: Report version and targets
        run: |
          ./bfc --version
          ./bfc --targets

  macos-arm:
    name: macOS ARM64
    runs-on: macos-26
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        run: make CXXFLAGS="-std=c++17 -O2 -Wall -Wextra -Werror"
      - name: Show deployment target
        run: otool -l ./bfc | grep -A4 LC_BUILD_VERSION | head -n 8 test
      - name: Report version and targets
        run: |
          ./bfc --version
          ./bfc --targets

  macos:
    name: macOS x86-64
    # macOS x86-64 is deprecated but still supported in this release.
    # It runs natively on the macOS 26 Tahoe Intel image (macos-26-intel).
    runs-on: macos-26-intel
    env:
      MACOSX_DEPLOYMENT_TARGET: "10.15"
    steps:
      - uses: actions/checkout@v4
      - name: Build (warnings are errors) and run tests
        run: make CXXFLAGS="-std=c++17 -O2 -Wall -Wextra -Werror"
      - name: Show deployment target
        run: otool -l ./bfc | grep -A4 LC_BUILD_VERSION | head -n 8 test
      - name: Report version and targets
        run: |
          file ./bfc
          ./bfc --version
          ./bfc --targets

  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build (warnings are errors)
        shell: pwsh
        run: g++ -std=c++17 -O2 -Wall -Wextra -Werror -static -o bfc.exe bfc.cpp
      - name: Run tests
        shell: pwsh
        run: ./tests/run_tests.ps1
      - name: Report version and targets
        shell: pwsh
        run: |
          ./bfc.exe --version
          ./bfc.exe --targets
