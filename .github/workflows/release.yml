name: Release artifacts

on:
  push:
    tags:
      - '20*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: Linux-x86_64
            cxxflags: "-std=c++17 -O2 -Wall -Wextra -Werror"
          - os: ubuntu-24.04-arm
            asset: Linux-arm64
            cxxflags: "-std=c++17 -O2 -Wall -Wextra -Werror"
          - os: macos-latest
            asset: macOS-arm64
            cxxflags: "-std=c++17 -O2 -Wall -Wextra -Werror"
          - os: macos-latest
            asset: macOS-x86_64
            cxxflags: "-std=c++17 -O2 -Wall -Wextra -Werror -arch x86_64"
          - os: windows-latest
            asset: Windows-x64
            cxxflags: ""
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            ver="$GITHUB_REF_NAME"
          else
            ver="$(sed -n 's/.*kVersion = "\(.*\)";.*/\1/p' bfc.cpp | head -n1 | tr ' ' '-')"
          fi
          echo "VER=$ver" >> "$GITHUB_ENV"
          echo "version: $ver"

      - name: Verify kVersion matches the tag
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          src="$(sed -n 's/.*kVersion = "\(.*\)";.*/\1/p' bfc.cpp | head -n1)"
          if [ "$src" != "$GITHUB_REF_NAME" ]; then
            echo "error: kVersion is '$src' but the tag is '$GITHUB_REF_NAME'"
            exit 1
          fi

      - name: Build (Unix)
        if: runner.os != 'Windows'
        run: make CXXFLAGS="${{ matrix.cxxflags }}"

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: g++ -std=c++17 -O2 -Wall -Wextra -Werror -static -o bfc.exe bfc.cpp

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          tar -czf "dist/bfc-${VER}-${{ matrix.asset }}.tar.gz" bfc LICENSE LICENSE-EXCEPTION.md
          ls -l dist

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item bfc.exe "dist/bfc-$env:VER-Windows-x64.exe"
          Get-ChildItem dist

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.asset }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish assets
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate SHA256SUMS
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - name: Upload assets to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="$GITHUB_REF_NAME"
          flags=""
          case "$tag" in
            *RC*|beta-*) flags="--prerelease" ;;
          esac
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "bfc $tag" --generate-notes $flags
          gh release upload "$tag" dist/* --clobber
